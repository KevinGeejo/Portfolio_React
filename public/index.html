<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon Configuration - Using existing favicon.ico -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#111111" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/logo192.png" />
    <meta
      name="msapplication-config"
      content="%PUBLIC_URL%/browserconfig.xml"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />

    <!-- Primary Meta Tags -->
    <title>Kevin - Full Stack Developer & CS Graduate | Portfolio</title>
    <meta
      name="title"
      content="Kevin - Full Stack Developer & CS Graduate | Portfolio"
    />
    <meta
      name="description"
      content="CS'24 graduate from DBIT with expertise in building efficient, reusable applications using cutting-edge technology. View my projects and experience in web development."
    />
    <meta
      name="keywords"
      content="Kevin, Full Stack Developer, Web Developer, React Developer, CS Graduate, DBIT, Portfolio, Web Development, JavaScript, React, Node.js"
    />
    <meta name="author" content="Kevin" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kevingeejo.me/" />
    <meta
      property="og:title"
      content="Kevin - Full Stack Developer & CS Graduate | Portfolio"
    />
    <meta
      property="og:description"
      content="CS'24 graduate from DBIT with expertise in building efficient, reusable applications using cutting-edge technology. View my projects and experience in web development."
    />
    <meta property="og:image" content="https://kevingeejo.me/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta
      property="og:image:alt"
      content="Kevin Geejo - Full Stack Developer Logo"
    />
    <meta property="og:site_name" content="Kevin's Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kevingeejo.me/" />
    <meta
      property="twitter:title"
      content="Kevin - Full Stack Developer & CS Graduate | Portfolio"
    />
    <meta
      property="twitter:description"
      content="CS'24 graduate from DBIT with expertise in building efficient, reusable applications using cutting-edge technology. View my projects and experience in web development."
    />
    <meta
      property="twitter:image"
      content="https://kevingeejo.me/logo512.png"
    />
    <meta
      property="twitter:image:alt"
      content="Kevin Geejo - Full Stack Developer Logo"
    />

    <!-- Additional SEO Meta Tags -->
    <meta name="application-name" content="Kevin's Portfolio" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://kevingeejo.me/" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Font Awesome with integrity -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Structured Data for Person/Portfolio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kevin Geejo",
        "jobTitle": "Full Stack Developer",
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "DBIT"
        },
        "description": "CS'24 graduate with expertise in building efficient, reusable applications using cutting-edge technology",
        "url": "https://kevingeejo.me/",
        "image": "https://kevingeejo.me/logo512.png",
        "sameAs": [
          "https://github.com/KevinGeejo",
          "https://linkedin.com/in/kevin-geejo"
        ],
        "knowsAbout": [
          "Web Development",
          "React",
          "JavaScript",
          "Full Stack Development",
          "Software Engineering"
        ],
        "hasOccupation": {
          "@type": "Occupation",
          "name": "Software Developer",
          "description": "Building efficient, reusable applications using cutting-edge technology"
        }
      }
    </script>

    <!-- Organization Schema for Logo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kevin Geejo Portfolio",
        "url": "https://kevingeejo.me/",
        "logo": "https://kevingeejo.me/logo512.png",
        "description": "Professional portfolio website showcasing web development projects and skills"
      }
    </script>
